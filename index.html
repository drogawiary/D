<!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <title>Dokument HTML</title>

    <style>

    body {
        background: #ffffff;
        padding: 15px;
        margin: 0;
        font-family: Georgia, sans-serif;
    }

    .page {
        max-width: 1200px;
        margin: auto;
        background: #ffffff;
        padding: 8px 10px;
        font-family: Georgia;
        color: #222222;
        line-height: 1.7;
        font-size: 28px;
    }

    h1, h2, h3, h4 {
        color: #222222;
    }

    blockquote {
        margin: 20px 0;
        padding-left: 20px;
        border-left: 4px solid #999;
        font-style: italic;
    }

    details {
        margin: 15px 0;
    }

    summary {
        cursor: pointer;
        font-weight: bold;
        padding: 5px;
    }

    section {
        display:none;
    }

    section.active {
        display:block;
    }

    </style>

    <script>

    function showPage(id){

        document.querySelectorAll("section").forEach(function(s){
            s.classList.remove("active");
        });

        document.getElementById(id).classList.add("active");

    }

    window.onload = function(){

        var first = document.querySelector("section");

        if(first){
            first.classList.add("active");
        }

    }

    </script>

    </head>

    <body>

    <div class="page">
    <!-- BANER ANIMOWANY -->
        <div style="max-width:1200px; margin:0 auto 25px auto; background:linear-gradient(90deg,#4a90e2,#357ABD); color:white; text-align:center; padding:35px 20px; font-size:clamp(24px,3vw,36px); font-weight:300; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,0.15); animation:slideDown 1s ease-out;">
        oo oo
        </div>

        <style>
        @keyframes slideDown {
        from {opacity:0;transform:translateY(-40px);}
        to {opacity:1;transform:translateY(0);}
        }
        </style>
        <!-- KONIEC BANERA ANIMOWANEGO -->
        
 <br>
chyba sie udało<br>
<br><a href="#" onclick="showPage('page0')">powrót</a>
    </div>

    </body>
    </html>
